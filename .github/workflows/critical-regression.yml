name: Critical business and security regression tests

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  critical-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-test-results
          path: test-results/
          if-no-files-found: warn
